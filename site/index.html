<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deployment Portal</title>
  <meta name="description"
    content="Customer-operated deployment catalog." />
  <link rel="stylesheet" href="assets/styles.css" />
</head>

<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <span class="brand-name" data-brand-name>Deployment Portal</span>
      </div>
      <nav class="header-links">
        <button id="nav-roadmap" class="header-link-btn" type="button">Roadmap &amp; retirements</button>
        <button id="nav-capacity" class="header-link-btn" type="button">Capacity</button>
        <div id="user-menu" class="user-menu" hidden>
          <button id="user-button" class="user-button" type="button" aria-haspopup="true"
            aria-expanded="false" aria-label="Account">
            <span id="user-avatar" class="user-avatar" aria-hidden="true"></span>
            <span id="user-name" class="user-name"></span>
            <svg class="user-caret" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div id="user-dropdown" class="user-dropdown" role="menu" hidden>
            <div class="user-card">
              <span id="user-avatar-lg" class="user-avatar user-avatar-lg" aria-hidden="true"></span>
              <div class="user-card-text">
                <div id="user-card-name" class="user-card-name"></div>
                <div id="user-card-upn" class="user-card-upn"></div>
              </div>
            </div>
            <button id="menu-deployments" class="menu-item" type="button" role="menuitem">
              My deployments
            </button>
            <button id="nav-admin" class="menu-item" type="button" role="menuitem" hidden>
              Admin
            </button>
            <button id="nav-setup" class="menu-item" type="button" role="menuitem" hidden>
              Setup
            </button>
            <button id="signout-button" class="signout-button" type="button" role="menuitem">
              Sign out
            </button>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <h1>Deployment catalog</h1>
      <div class="hero-actions">
        <input id="search" type="search" placeholder="Search use cases…" aria-label="Search use cases" />
        <span id="result-count" class="result-count"></span>
        <button id="submit-usecase" class="submit-cta" type="button">+ Submit a use case</button>
      </div>
    </div>
  </section>

  <main class="wrap layout">
    <aside class="filters" aria-label="Filters">
      <details class="filter-group" data-filter-key="category">
        <summary class="filter-summary">
          <span class="collapse-title" role="heading" aria-level="3">Category</span>
          <span class="collapse-caret" aria-hidden="true"></span>
        </summary>
        <div id="filter-category" class="filter-options"></div>
      </details>
      <details class="filter-group" data-filter-key="industry">
        <summary class="filter-summary">
          <span class="collapse-title" role="heading" aria-level="3">Industry</span>
          <span class="collapse-caret" aria-hidden="true"></span>
        </summary>
        <div id="filter-industry" class="filter-options"></div>
      </details>
      <details class="filter-group" data-filter-key="compliance">
        <summary class="filter-summary">
          <span class="collapse-title" role="heading" aria-level="3">Compliance</span>
          <span class="collapse-caret" aria-hidden="true"></span>
        </summary>
        <div id="filter-compliance" class="filter-options"></div>
      </details>
      <button id="clear-filters" class="clear-btn" type="button">Clear filters</button>
    </aside>

    <section class="cards" id="cards" aria-live="polite"></section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel modal-panel-full" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" data-close aria-label="Close">&times;</button>
      <div id="modal-body" class="modal-body-full"></div>
    </div>
  </div>

  <div id="panel" class="modal" hidden>
    <div class="modal-backdrop" data-panel-close></div>
    <div class="modal-panel modal-panel-wide" role="dialog" aria-modal="true">
      <button class="modal-close" data-panel-close aria-label="Close">&times;</button>
      <div id="panel-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <p>Customer operated. Cost estimates are indicative; verify against your cloud agreement.</p>
    </div>
  </footer>

  <script src="assets/api.js"></script>
  <script src="assets/panel.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/user-menu.js"></script>
  <script src="assets/account.js"></script>
  <script src="assets/admin.js"></script>
  <script src="assets/setup.js"></script>
</body>

</html>
