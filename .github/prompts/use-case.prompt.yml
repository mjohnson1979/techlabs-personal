messages:
  - role: system
    content: |
      You convert a natural-language description of an Azure scenario into a structured
      catalog entry for an Infrastructure-as-Code gallery. Read the submission (which may
      include an optional title and a free-form description) and produce the entry.

      Guidance for each field:
      - displayName: a concise, human-friendly title. If the submission gives a title, refine it; otherwise invent a clear one.
      - slug: lowercase, dash-separated, derived from the title; letters, numbers and dashes only (e.g. "realtime-iot-dashboard").
      - category: choose the single best fit from the allowed enum.
      - description: one sentence shown on a gallery card.
      - what: 2-4 sentences describing the architecture and how the Azure services fit together.
      - why: 1-3 sentences on the business problem it solves and when to reach for it.
      - potentialUseCases: 2-5 concrete example scenarios.
      - services: the core Azure services, using official product names (e.g. "Azure App Service", "Azure Cosmos DB", "Event Hubs", "Azure OpenAI", "Azure Monitor"). Only include services grounded in the description; do not invent unrelated ones.
      - industries: relevant industries, or ["Cross-industry"] if general.
      - compliance: ["Baseline"] unless the description clearly implies specific regimes (e.g. HIPAA, PCI).

      Stay grounded in the submission. Do not add services or claims it does not support.
  - role: user
    content: |
      Use-case submission:
      {{submission}}
model: openai/gpt-4o
modelParameters:
  temperature: 0.2
  maxCompletionTokens: 1500
responseFormat: json_schema
jsonSchema: |-
  {
    "name": "catalog_use_case",
    "strict": true,
    "schema": {
      "type": "object",
      "properties": {
        "displayName": { "type": "string", "description": "Concise human-friendly title." },
        "slug": { "type": "string", "description": "lowercase-dash slug, [a-z0-9-] only." },
        "category": {
          "type": "string",
          "enum": [
            "AI / GenAI", "Web & API", "Data & Analytics", "Containers",
            "Networking", "Integration", "End-User Computing",
            "Hybrid & Migration", "Foundation", "Security & Identity", "Other"
          ]
        },
        "description": { "type": "string", "description": "One-sentence card summary." },
        "what": { "type": "string", "description": "2-4 sentences on the architecture." },
        "why": { "type": "string", "description": "1-3 sentences on the problem it solves." },
        "potentialUseCases": { "type": "array", "items": { "type": "string" } },
        "services": { "type": "array", "items": { "type": "string" } },
        "industries": { "type": "array", "items": { "type": "string" } },
        "compliance": { "type": "array", "items": { "type": "string" } }
      },
      "additionalProperties": false,
      "required": [
        "displayName", "slug", "category", "description", "what", "why",
        "potentialUseCases", "services", "industries", "compliance"
      ]
    }
  }
