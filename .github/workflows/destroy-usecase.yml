name: Destroy use case

# Tears down a use-case deployment by deleting its resource group. Dispatched by
# the gallery backend when a deployment's end time is reached (auto-cleanup) or
# when a user/admin clicks "Tear down now". Can also be run manually.

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: "Resource group to delete"
        required: true
        type: string
      subscription_id:
        description: "Subscription ID (defaults to repo secret)"
        required: false
        type: string
      deployment_id:
        description: "Gallery deployment id (for status callback)"
        required: false
        type: string
      callback_url:
        description: "Gallery callback URL (status updates)"
        required: false
        type: string

concurrency:
  group: destroy-${{ inputs.resource_group }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve subscription + run URL
        run: |
          set -euo pipefail
          sub="${{ inputs.subscription_id }}"
          if [ -z "$sub" ]; then sub="${{ secrets.AZURE_SUBSCRIPTION_ID }}"; fi
          echo "SUBSCRIPTION=$sub" >> "$GITHUB_ENV"
          echo "RUN_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION }}

      - name: Delete resource group
        run: |
          set -euo pipefail
          az account set --subscription "$SUBSCRIPTION"
          # Safety: only delete groups this system manages.
          if [ "$(az group exists --name "${{ inputs.resource_group }}")" != "true" ]; then
            echo "resource group already gone"; exit 0
          fi
          managed=$(az group show --name "${{ inputs.resource_group }}" \
            --query "tags.\"techlabs-managed\"" -o tsv 2>/dev/null || echo "")
          if [ "$managed" != "true" ]; then
            echo "::error::refusing to delete unmanaged resource group ${{ inputs.resource_group }}"
            exit 1
          fi
          az group delete --name "${{ inputs.resource_group }}" --yes

      - name: Report destroyed
        if: success() && inputs.callback_url != ''
        run: |
          curl -fsS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Techlabs-Callback-Token: ${{ secrets.GALLERY_CALLBACK_TOKEN }}" \
            -d "{\"status\":\"destroyed\",\"runUrl\":\"$RUN_URL\",\"detail\":\"resource group deleted\"}" \
            || echo "::warning::status callback failed"

      - name: Report failure
        if: failure() && inputs.callback_url != ''
        run: |
          curl -fsS -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Techlabs-Callback-Token: ${{ secrets.GALLERY_CALLBACK_TOKEN }}" \
            -d "{\"status\":\"failed\",\"runUrl\":\"$RUN_URL\",\"detail\":\"teardown failed — see run logs\"}" \
            || echo "::warning::status callback failed"
