name: Deploy gallery to App Service

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "catalog/**"
      - "tools/Build-Templates.ps1"
      - ".github/workflows/deploy-gallery.yml"
  workflow_dispatch:

concurrency:
  group: deploy-gallery
  cancel-in-progress: true

permissions:
  id-token: write # OIDC login to Azure
  contents: read

env:
  AZURE_WEBAPP_NAME: techlabs-gallery-w362xa
  AZURE_WEBAPP_PACKAGE_PATH: site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r site/requirements.txt pytest

      - name: Verify executor SDK (fails before deploy if SDK layout is wrong)
        run: python -m pytest site/server/tests -v

      - name: Install Bicep
        run: |
          set -euo pipefail
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Compile use-case templates
        shell: pwsh
        run: ./tools/Build-Templates.ps1

      # Basic-auth publishing is disabled on the web app, so we deploy with the
      # user-assigned identity (id-techlabs-deployer) via OIDC instead of a
      # publish profile. Same repo variables/credential as capacity.yml.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
