name: Deploy gallery to App Service

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "catalog/**"
      - "tools/Build-Templates.ps1"
      - ".github/workflows/deploy-gallery.yml"
  workflow_dispatch:

concurrency:
  group: deploy-gallery
  cancel-in-progress: true

permissions:
  id-token: write # OIDC login to Azure
  contents: read

env:
  AZURE_WEBAPP_NAME: techlabs-gallery-w362xa
  AZURE_WEBAPP_PACKAGE_PATH: site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r site/requirements.txt pytest

      - name: Verify executor SDK (fails before deploy if SDK layout is wrong)
        run: python -m pytest site/server/tests -v

      - name: Install Bicep
        run: |
          set -euo pipefail
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: Compile use-case templates
        shell: pwsh
        run: ./tools/Build-Templates.ps1

      # Basic-auth publishing is disabled on the web app, so we deploy with the
      # user-assigned identity (id-techlabs-deployer) via OIDC instead of a
      # publish profile. Same repo variables/credential as capacity.yml.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # Enable the in-app Terraform deploy engine on the live host. These settings
      # let the app provision a pinned terraform binary on first boot and deploy
      # with its managed identity (ARM_USE_MSI). The in-app option stays hidden
      # until the binary is present; the Terraform CLI snippet is always shown.
      # Tenant/subscription reuse the same repo vars/secrets as the OIDC login,
      # so no new configuration is required. Idempotent: only writes when a value
      # is missing or differs, so steady-state deploys cause no app restart.
      - name: Enable Terraform engine (app settings)
        shell: bash
        env:
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          rg=$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" -o tsv)
          if [ -z "$rg" ]; then
            echo "Could not resolve resource group for ${AZURE_WEBAPP_NAME}" >&2
            exit 1
          fi
          echo "Resolved resource group: $rg"

          declare -A want=(
            [GALLERY_TERRAFORM_AUTO_INSTALL]=true
            [ARM_USE_MSI]=true
            [ARM_SUBSCRIPTION_ID]="${ARM_SUBSCRIPTION_ID}"
            [ARM_TENANT_ID]="${ARM_TENANT_ID}"
          )

          current=$(az webapp config appsettings list \
            --name "${AZURE_WEBAPP_NAME}" --resource-group "$rg" -o json)

          changes=()
          for key in "${!want[@]}"; do
            have=$(echo "$current" | jq -r --arg k "$key" '.[] | select(.name==$k) | .value')
            if [ "$have" != "${want[$key]}" ]; then
              changes+=("${key}=${want[$key]}")
              echo "will set ${key} (was: '${have:-<unset>}')"
            else
              echo "ok ${key} already set"
            fi
          done

          if [ ${#changes[@]} -eq 0 ]; then
            echo "All Terraform engine app settings already present; no change."
          else
            az webapp config appsettings set \
              --name "${AZURE_WEBAPP_NAME}" \
              --resource-group "$rg" \
              --settings "${changes[@]}" \
              -o none
            echo "Applied ${#changes[@]} app setting(s)."
          fi
