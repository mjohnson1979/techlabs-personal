# Refreshes site/registry.json every few days so the gallery's advanced
# deployment options offer the models and service SKUs Azure actually provides
# today (new providers/models appear, retired SKUs drop off) with per-region
# availability across the Americas.
#
# Uses the same OIDC setup as capacity.yml (federated credential on
# id-techlabs-deployer; AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
# as repository Variables or Secrets). When registry.json changes it commits to
# main, which triggers deploy-gallery.yml to publish the updated snapshot.

name: Refresh service & model registry

on:
  schedule:
    # 05:00 UTC every 3 days.
    - cron: "0 5 */3 * *"
  workflow_dispatch:

concurrency:
  group: registry
  cancel-in-progress: false

permissions:
  id-token: write # OIDC login to Azure
  contents: write # commit the refreshed registry.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Azure OIDC config is present
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "::error::AZURE_${name} is not set. Add it under Settings -> Secrets and variables -> Actions (Variables tab)."
              missing=1
            else
              echo "AZURE_${name} is set (length ${#val})."
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more Azure OIDC values are missing; aborting before azure/login."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build registry snapshot
        shell: pwsh
        run: ./tools/Build-Registry.ps1 -SubscriptionId "${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Commit registry.json if it changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/registry.json; then
            echo "registry.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/registry.json
          git commit -m "chore: refresh service & model registry snapshot"
          git push
