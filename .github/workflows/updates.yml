# Refreshes site/updates.json weekly so the gallery surfaces Azure service
# lifecycle changes (retirements, previews, recent GA) for the services each
# use case provisions.
#
# No setup required: tools/Build-Updates.ps1 reads the public Microsoft Release
# Communications feed that powers https://azure.microsoft.com/updates, so this
# workflow needs no Azure sign-in, secrets, or OIDC.
#
# When updates.json changes, this commits it to main, which triggers
# deploy-gallery.yml to publish the updated snapshot.

name: Refresh Azure updates

on:
  schedule:
    # 05:00 UTC every Monday.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: updates
  cancel-in-progress: false

permissions:
  contents: write # commit the refreshed updates.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Azure updates snapshot
        shell: pwsh
        run: ./tools/Build-Updates.ps1

      - name: Commit updates.json if it changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/updates.json; then
            echo "updates.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/updates.json
          git commit -m "chore: refresh Azure updates snapshot"
          # main can advance mid-run (merges, other jobs); rebase and retry so the
          # push stays a fast-forward instead of failing on a race.
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt/5); rebasing on origin/main..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase conflict refreshing the snapshot; aborting"
              exit 1
            fi
          done
          echo "::error::could not push after 5 attempts"
          exit 1
