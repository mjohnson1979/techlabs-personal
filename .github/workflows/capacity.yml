# Refreshes site/capacity.json daily so the gallery's region picker and the
# "Region capacity" page reflect current subscription quota and regional
# availability for capacity-sensitive services.
#
# One-time setup (OIDC, no secrets):
#   1. A federated credential already exists on the user-assigned identity
#      `id-techlabs-deployer` (RG TechLabs) with subject
#      repo:mcaps-microsoft/TechLabs:ref:refs/heads/main.
#   2. Add these *repository variables* (Settings -> Secrets and variables ->
#      Actions -> Variables). Secrets with the same names also work.
#        AZURE_CLIENT_ID       = 0159c318-e7f6-4443-87c2-27b47c22a61c
#        AZURE_TENANT_ID       = 2929f0bd-f87b-47ae-bb73-ec22b65de557
#        AZURE_SUBSCRIPTION_ID = 8ad2703f-069c-4c1a-8f4f-850c2a4c2676
#
# When capacity.json changes, this commits it to main, which triggers
# deploy-gallery.yml to publish the updated snapshot.

name: Refresh region capacity

on:
  schedule:
    # 06:00 UTC daily.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: capacity
  cancel-in-progress: false

permissions:
  id-token: write # OIDC login to Azure
  contents: write # commit the refreshed capacity.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Azure OIDC config is present
        env:
          # Accept the IDs from either repository Variables or Secrets.
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION_ID; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "::error::AZURE_${name} is not set. Add it under Settings -> Secrets and variables -> Actions (Variables tab)."
              missing=1
            else
              echo "AZURE_${name} is set (length ${#val})."
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more Azure OIDC values are missing; aborting before azure/login."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build capacity snapshot
        shell: pwsh
        run: ./tools/Build-Capacity.ps1 -SubscriptionId "${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Commit capacity.json if it changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/capacity.json; then
            echo "capacity.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/capacity.json
          git commit -m "chore: refresh region capacity snapshot"
          git push
