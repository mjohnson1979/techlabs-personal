name: Deploy use case

# Manual, GitHub-side deploy button for a catalog use case (the "deploy in
# GitHub" path). Run it from the Actions tab → Run workflow. It authenticates to
# Azure with OIDC federated credentials (no stored secret) and deploys the use
# case's Bicep into the resource group you name.
#
# The website's Deploy button does NOT use this workflow — the gallery backend
# deploys directly with its managed identity (see site/server/azure_deploy.py).

on:
  workflow_dispatch:
    inputs:
      use_case:
        description: "Catalog path, e.g. web-app or landing-zone/ai"
        required: true
        type: string
      environment:
        description: "Parameter set to deploy"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      resource_group:
        description: "Target resource group (created if missing)"
        required: true
        type: string
      location:
        description: "Azure region for the resource group"
        required: false
        default: eastus
        type: string
      subscription_id:
        description: "Target subscription ID (defaults to repo secret)"
        required: false
        type: string

concurrency:
  group: deploy-${{ inputs.resource_group }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          set -euo pipefail
          tmpl="catalog/${{ inputs.use_case }}/main.bicep"
          prm="catalog/${{ inputs.use_case }}/parameters/${{ inputs.environment }}.bicepparam"
          if [ ! -f "$tmpl" ]; then echo "::error::template not found: $tmpl"; exit 1; fi
          if [ ! -f "$prm" ]; then echo "::error::parameters not found: $prm"; exit 1; fi
          echo "TEMPLATE=$tmpl" >> "$GITHUB_ENV"
          echo "PARAMS=$prm" >> "$GITHUB_ENV"
          sub="${{ inputs.subscription_id }}"
          if [ -z "$sub" ]; then sub="${{ secrets.AZURE_SUBSCRIPTION_ID }}"; fi
          echo "SUBSCRIPTION=$sub" >> "$GITHUB_ENV"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION }}

      - name: Create resource group
        run: |
          set -euo pipefail
          az account set --subscription "$SUBSCRIPTION"
          az group create \
            --name "${{ inputs.resource_group }}" \
            --location "${{ inputs.location }}" \
            --tags techlabs-usecase="${{ inputs.use_case }}" \
                   techlabs-managed=true

      - name: Deploy Bicep
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "${{ inputs.resource_group }}" \
            --template-file "$TEMPLATE" \
            --parameters "$PARAMS" \
            --name "techlabs-$(date +%s)"
