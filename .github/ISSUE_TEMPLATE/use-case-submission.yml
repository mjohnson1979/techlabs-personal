name: Submit a use case
description: Describe an Azure use case in plain English. AI turns it into a draft pull request for the gallery.
title: "[Use case] "
labels: ["use-case"]
body:
  - type: markdown
    attributes:
      value: |
        Just describe the scenario in your own words — no fields to fill in, no code to write.
        When you submit, an automation uses AI to structure your description into a catalog
        entry (`catalog/<slug>/metadata.json`) and opens a **draft pull request** for a
        maintainer to author the Bicep and publish it to the gallery.
  - type: textarea
    id: description
    attributes:
      label: Describe your use case
      description: |
        In plain English, explain what the use case is, the problem it solves, and which
        Azure services it uses. Mention the architecture and any industries or compliance
        needs if relevant. The more detail, the better the result.
      placeholder: |
        A real-time IoT dashboard for manufacturing. Devices stream telemetry into Azure
        Event Hubs; Stream Analytics aggregates it on the fly and writes results to Cosmos DB;
        a web dashboard on App Service reads from Cosmos and Application Insights tracks health.
        It lets plant operators spot failing machines live without standing up their own Kafka.
    validations:
      required: true
  - type: input
    id: displayName
    attributes:
      label: Use case name (optional)
      description: A short title. Leave blank and the AI will name it for you.
      placeholder: Realtime IoT telemetry dashboard
    validations:
      required: false

