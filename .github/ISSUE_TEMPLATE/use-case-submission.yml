name: Submit a use case
description: Propose a new Azure use case for the SME&C Techlabs gallery. An automation turns this into a draft pull request for review.
title: "[Use case] "
labels: ["use-case"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a use case! Fill in the scenario and the Azure services it uses.
        When you submit, a GitHub Action scaffolds `catalog/<slug>/metadata.json` and opens a
        **draft pull request** so a maintainer can author the Bicep/parameters and merge it into
        the gallery. You don't need to write any code here.
  - type: input
    id: displayName
    attributes:
      label: Use case name
      description: A short, human-friendly title shown on the gallery card.
      placeholder: Realtime IoT telemetry dashboard
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Short identifier (slug)
      description: Lowercase folder name under catalog/ (letters, numbers, dashes). Leave blank to derive it from the name.
      placeholder: iot-telemetry-dashboard
    validations:
      required: false
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: The gallery filter group this belongs to.
      options:
        - AI / GenAI
        - Web & API
        - Data & Analytics
        - Containers
        - Networking
        - Integration
        - End-User Computing
        - Hybrid & Migration
        - Foundation
        - Security & Identity
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: One-line description
      description: A single sentence summarising the scenario (shown on the card).
      placeholder: Streams device telemetry through Event Hubs into a real-time analytics dashboard.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it is
      description: Describe the architecture and how the pieces fit together.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: The business problem this pattern solves and when to reach for it.
    validations:
      required: true
  - type: textarea
    id: services
    attributes:
      label: Azure services used
      description: List the core Azure services, one per line.
      placeholder: |
        Event Hubs
        Stream Analytics
        Azure Cosmos DB
        Azure Monitor
    validations:
      required: true
  - type: textarea
    id: potential
    attributes:
      label: Example scenarios
      description: A few concrete situations where this use case applies, one per line.
      placeholder: |
        A fleet operator monitoring vehicle sensors
        A factory floor tracking machine health
    validations:
      required: false
  - type: input
    id: industries
    attributes:
      label: Industries
      description: Comma-separated industries this targets. Defaults to "Cross-industry".
      placeholder: Manufacturing, Retail
    validations:
      required: false
  - type: input
    id: compliance
    attributes:
      label: Compliance baselines
      description: Comma-separated compliance baselines (e.g. Baseline, PCI, HIPAA). Defaults to "Baseline".
      placeholder: Baseline
    validations:
      required: false
  - type: input
    id: contact
    attributes:
      label: Your contact (optional)
      description: How a maintainer can reach you with questions.
      placeholder: alias@microsoft.com
    validations:
      required: false
